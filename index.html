<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator HPP & Harga Jual Marketplace — AKBAR KIT</title>
  <link rel="icon" type="image/png" href="logo.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #27272a;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      height: 36px;
      width: auto;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.16em;
      background: linear-gradient(135deg, #f5e6b8 0%, #d4af37 50%, #aa8220 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-free {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      letter-spacing: 0.05em;
    }

    .nav-link {
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: #fcd34d;
      background: #18181b;
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 7px 12px;
      border-radius: 999px;
      transition: 0.2s;
    }

    .nav-link:hover {
      background: #27272a;
    }

    /* Heading */
    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .hero p {
      font-size: 13px;
      color: #a1a1aa;
    }

    /* Card */
    .card {
      background-color: #121216;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      background-color: #18181d;
      border: 1px solid #3f3f46;
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #d4af37;
    }

    /* Preset Buttons */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .preset-btn {
      background: #18181d;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      font-size: 11px;
      font-weight: 600;
      padding: 9px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .preset-btn:hover, .preset-btn.active {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.15);
      color: #fcd34d;
    }

    .input-suffix {
      position: relative;
    }

    .input-suffix span {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #a1a1aa;
      font-size: 14px;
      font-weight: 600;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* CTA Button */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #f5e6b8 0%, #d4af37 50%, #b58d22 100%);
      color: #09090b;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
      transition: transform 0.15s, filter 0.2s;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Result Box */
    .result-section {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #27272a;
    }

    .price-highlight {
      background: #18181d;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coret-label {
      font-size: 12px;
      color: #a1a1aa;
    }

    .coret-val {
      font-size: 14px;
      color: #71717a;
      text-decoration: line-through;
    }

    .final-label {
      font-size: 14px;
      font-weight: 600;
      color: #e4e4e7;
    }

    .final-val {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #f5e6b8 0%, #d4af37 60%, #b58d22 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .breakdown-box {
      background: #16161a;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .breakdown-row:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px solid #27272a;
      font-weight: 700;
    }

    .text-muted { color: #a1a1aa; }
    .text-red { color: #f87171; font-weight: 600; }
    .text-green { color: #34d399; font-weight: 700; }

    /* Cross-Sell Tools AKBAR KIT */
    .tools-box {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .tools-box p {
      font-size: 12px;
      color: #fde68a;
      margin-bottom: 10px;
    }

    .tools-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-tool-pro {
      display: block;
      text-decoration: none;
      background: linear-gradient(135deg, #f5e6b8 0%, #d4af37 100%);
      color: #09090b;
      font-size: 12px;
      font-weight: 800;
      padding: 10px;
      border-radius: 10px;
    }

    .btn-tool-sec {
      display: block;
      text-decoration: none;
      background: #18181d;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
      padding: 9px;
      border-radius: 10px;
    }

    .btn-tool-sec:hover {
      border-color: #d4af37;
      color: #fcd34d;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #71717a;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <img src="logo.png" alt="AKBAR KIT" onerror="this.style.display='none'" />
        <span class="brand-title">AKBAR KIT</span>
        <span class="badge-free">GRATIS</span>
      </div>
      <a href="https://kalkulator-akbarkit.pages.dev/" class="nav-link">
        Kalkulator Affiliate →
      </a>
    </header>

    <!-- Title -->
    <div class="hero">
      <h1>Kalkulator HPP & Harga Jual Marketplace</h1>
      <p>Hitung harga jual anti-boncos setelah dipotong biaya admin & promo toko.</p>
    </div>

    <!-- Form Card -->
    <div class="card">

        <div class="input-suffix">
          <input type="number" step="0.1" id="adminFee" value="11.5" />
          <span>%</span>
        </div>
      </div>

      <div class="form-group grid-2">
        <div>
          <label for="packing">Biaya Packing (Rp)</label>
          <input type="number" id="packing" value="1500" />
        </div>
        <div>
          <label for="discount">Diskon Coret (%)</label>
          <input type="number" id="discount" value="20" />

      </div>

      <button type="button" class="btn-primary" onclick="hitungHarga()">
        Hitung Harga Jual Ideal
      </button>

      <!-- Hasil Perhitungan -->
      <div class="result-section" id="resultBox">

          <div class="row-between" style="margin-bottom: 4px;">
            <span class="coret-label">Harga Coret (Etalase):</span>
            <span class="coret-val" id="resHargaCoret">Rp51.554</span>
          </div>
          <div class="row-between">
            <span class="final-label">Harga Jual Akhir:</span>
            <span class="final-val" id="resHargaJual">Rp41.243</span>
